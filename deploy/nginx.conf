# nginx перед приложением «Ноготочки»: TLS, редирект на HTTPS и проксирование
# API вместе с веб-фронтендом (оба живут на одном origin, поэтому CORS не нужен).
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/nogotki
#   sudo ln -s /etc/nginx/sites-available/nogotki /etc/nginx/sites-enabled/nogotki
#   # Домен замените на свой: sed -i 's/example.com/YOUR-DOMAIN.ru/g' /etc/nginx/sites-available/nogotki
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат Let's Encrypt (после первого reload по HTTP):
#   sudo certbot --nginx -d YOUR-DOMAIN.ru

# --- HTTP: только проверка сертификата и редирект ---
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Каталог для ACME-challenge: certbot берёт его отсюда.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: всё остальное ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # Пути к сертификату выдаёт certbot. Проверить можно так:
    #   sudo certbot certificates
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Приложение само пишет X-Powered-By: disable, а заголовки безопасности
    # добавляем здесь — они одинаковы для API и для статики.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Тело запросов у клиента маленькое (JSON с контактами), 1 МБ — с запасом.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/nogotki.access.log;
    error_log  /var/log/nginx/nogotki.error.log;

    # --- Статика фронтенда: отдаём сами, раз в сутки проверяя изменения ---
    # /css, /js, шрифты и картинки меняются только при деплое новой версии,
    # поэтому их можно кэшировать надолго. HTML не кэшируем: он и есть «как
    # выглядит боевой сайт», и после деплоя он должен обновиться сразу.
    location ~* ^/(css|js|tokens\.css)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Всё остальное (API и HTML) — на приложение.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Эти заголовки нужны приложению, чтобы limit по входам видел реальный
        # IP клиента, а не адрес nginx. Им же соответствует TRUST_PROXY=1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }
}
