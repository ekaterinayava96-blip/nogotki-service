<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Восстановление пароля — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="global-header"></div>

  <main class="auth-wall">
    <h1>Восстановление пароля</h1>
    <div class="panel">
      <p class="hint" style="margin-bottom:var(--space-5)">
        Укажите логин — мы проверим, как можно восстановить доступ к этому аккаунту.
      </p>
      <div id="error" class="alert alert--error" hidden></div>

      <!--
        Аккаунт, созданный через Яндекс, пароля не имеет. Сбрасывать нечего,
        поэтому вместо письма сервер отвечает PASSWORDLESS_ACCOUNT, и здесь
        показывается текст про Яндекс. В прототипе этого блока нет.
      -->
      <div id="yandex-note" class="alert alert--neutral" hidden>
        <p style="margin:0 0 var(--space-3)">
          Этот аккаунт входит через Яндекс — пароля у него нет. Восстанавливать нечего.
        </p>
        <button type="button" class="btn btn--secondary btn--sm" id="yandexLogin">
          Войти через Яндекс
        </button>
      </div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="forgot-username">Логин</label>
          <input id="forgot-username" name="username" autocomplete="username"
                 placeholder="Только латиница, цифры, _ и ." autofocus>
          <span class="hint">3–32 символа: латиница, цифры, «_» и «.»</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--md btn--block">Отправить</button>
        </div>
      </form>

      <p class="form-alt"><a href="login.html">Вспомнили пароль? Войти</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script src="js/yandex-login.js"></script>
  <script>
    (function () {
      var form = document.getElementById('forgot-form');
      var username = document.getElementById('forgot-username');
      var submit = form.querySelector('button[type="submit"]');
      var yandexNote = document.getElementById('yandex-note');

      function fieldError(input, msg) {
        var box = input.closest('.field');
        var el = box.querySelector('.field__error');
        if (msg) {
          box.classList.add('field--invalid');
          el.textContent = msg;
          el.hidden = false;
        } else {
          box.classList.remove('field--invalid');
          el.textContent = '';
          el.hidden = true;
        }
      }
      username.addEventListener('input', function () {
        fieldError(username, '');
        yandexNote.hidden = true;
      });

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        fieldError(username, '');

        var value = username.value.trim();
        if (!/^[a-zA-Z0-9_.]{3,32}$/.test(value)) {
          fieldError(username, 'Логин: только латиница, цифры, «_» и «.» (3–32 симв.).');
          return;
        }

        submit.disabled = true;
        // Письма сервис не отправляет: почтового провайдера в проекте нет.
        // Сервер отвечает, что делать с этим аккаунтом: сброс пароля,
        // вход через Яндекс или «восстановление не подключено».
        window.api.request('/api/auth/password/forgot', { method: 'POST', json: { username: value } })
          .then(function (data) {
            submit.disabled = false;
            if (data && data.method === 'yandex') {
              // Аккаунт без пароля: вместо письма — текст про Яндекс.
              yandexNote.hidden = false;
              return;
            }
            // Несуществующий аккаунт: сервер отвечает нейтрально, чтобы по
            // ответу нельзя было перебирать логины.
            if (data && data.sent) {
              window.ui.error('Если такой логин есть, мы покажем, как восстановить к нему доступ.');
            }
          })
          .catch(function () {
            submit.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
