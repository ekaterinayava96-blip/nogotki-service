<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Восстановление пароля — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <header class="nav">
    <div class="container nav__inner">
      <a class="brand" href="index.html"><span class="brand__dot" aria-hidden="true"></span>Ноготочки</a>
      <nav class="nav__links" aria-label="Основная навигация">
        <a href="login.html">Вход</a>
      </nav>
    </div>
  </header>

  <main class="auth-wall">
    <h1>Восстановление пароля</h1>
    <div class="panel">
      <p class="hint" style="margin-bottom:var(--space-5)">
        Укажите ваш логин — мы отправим ссылку для установки нового пароля.
      </p>
      <div id="error" class="alert alert--error" hidden></div>
      <div id="ok" class="alert alert--success" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="forgot-username">Логин</label>
          <input id="forgot-username" name="username" autocomplete="username" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--md btn--block">Отправить ссылку</button>
        </div>
      </form>

      <p class="form-alt"><a href="login.html">Вернуться ко входу</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      document.getElementById('forgot-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        var submit = this.querySelector('button[type="submit"]');
        submit.disabled = true;

        var body = {
          username: document.getElementById('forgot-username').value.trim()
        };
        window.api.request('/api/auth/password/forgot', { method: 'POST', json: body })
          .then(function () {
            window.location.href = 'reset.html';
          })
          .catch(function () { submit.disabled = false; });
      });
    })();
  </script>
</body>
</html>
