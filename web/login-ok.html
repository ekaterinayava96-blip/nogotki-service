<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход выполнен — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="global-header"></div>

  <main class="splash">
    <div class="container">
      <div id="error" class="alert alert--error" hidden></div>
      <div class="splash__icon">✓</div>
      <h1>Вход выполнен</h1>
      <p id="hello">Добро пожаловать в «Ноготочки»!</p>
      <div>
        <a class="btn btn--primary btn--md" href="index.html#services">Записаться</a>
        <a class="btn btn--ghost btn--md" href="index.html">На главную</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script>
    (function () {
      var u = window.api.user() || {};
      var name = u.username || '';
      if (name) document.getElementById('hello').textContent = 'Добро пожаловать, ' + name + '!';
    })();
  </script>
</body>
</html>
