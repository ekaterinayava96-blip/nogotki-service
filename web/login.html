<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="global-header"></div>

  <main class="auth-wall">
    <h1>Вход в аккаунт</h1>
    <div class="panel">
      <div id="error" class="alert alert--error" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-username">Логин</label>
          <input id="login-username" name="username" autocomplete="username"
                 placeholder="Латиница, цифры, _ и ." autofocus>
          <span class="field__error" hidden></span>
        </div>
        <div class="field">
          <label for="login-password">Пароль</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password">
          <span class="field__error" hidden></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--md btn--block">Войти</button>
        </div>
      </form>

      <p class="form-alt"><a href="forgot.html">Забыли пароль?</a></p>
      <p class="form-alt">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var username = document.getElementById('login-username');
      var password = document.getElementById('login-password');
      var submit = form.querySelector('button[type="submit"]');

      // Уже вошли (кука есть) — сразу туда, откуда пришли (returnTo),
      // иначе в кабинет, с паролем не дёргаем сервер.
      window.api.me().then(function (user) {
        if (user) window.ui.afterAuth();
      });

      function fieldBox(input) {
        return input.closest('.field');
      }
      function fieldError(input, msg) {
        var box = fieldBox(input);
        if (!box) return;
        var el = box.querySelector('.field__error');
        if (msg) {
          box.classList.add('field--invalid');
          el.textContent = msg;
          el.hidden = false;
        } else {
          box.classList.remove('field--invalid');
          el.textContent = '';
          el.hidden = true;
        }
      }
      function clearFieldErrors() {
        fieldError(username, '');
        fieldError(password, '');
      }
      [username, password].forEach(function (input) {
        input.addEventListener('input', function () { fieldError(input, ''); });
      });

      // Зеркало серверных правил (validate.js) — для мгновенной подсказки.
      // Настоящая проверка всё равно на сервере, её ответ показываем ниже.
      function validUsername(v) { return /^[a-zA-Z0-9_.]{3,32}$/.test(v.trim()); }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        clearFieldErrors();

        var body = {
          username: username.value.trim(),
          password: password.value
        };

        var ok = true;
        if (!validUsername(body.username)) {
          fieldError(username, 'Логин: только латиница, цифры, «_» и «.» (3–32 симв.).');
          ok = false;
        }
        if (body.password.length < 8) {
          fieldError(password, 'Пароль должен быть не короче 8 символов.');
          ok = false;
        }
        if (!ok) return;

        submit.disabled = true;
        window.api.request('/api/auth/login', { method: 'POST', json: body })
          .then(function () {
            window.ui.afterAuth();
          })
          .catch(function (err) {
            submit.disabled = false;
            // Что сказал сервер, показываем в #error (пишет api.request).
            // Поле подсвечиваем, если сервер указал, где проблема.
            if (err.code === 'INVALID_CREDENTIALS') {
              var msg = 'Неверный логин или пароль.';
              fieldError(username, msg);
              fieldError(password, msg);
            } else if (err.status === 400 || err.code === 'USERNAME_TAKEN' || err.code === 'PHONE_TAKEN') {
              var m = String(err.message || '');
              if (/username|Логин/.test(m)) fieldError(username, err.message);
              else if (/password|Пароль/.test(m)) fieldError(password, err.message);
            }
          });
      });
    })();
  </script>
</body>
</html>
