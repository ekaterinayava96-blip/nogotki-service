<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="global-header"></div>

  <main class="auth-wall">
    <h1>Регистрация клиента</h1>
    <div class="panel">
      <p class="hint" style="margin-bottom:var(--space-5)">
        Имя и телефон будут использоваться для записи — они подставляются в карточку брони автоматически.
      </p>
      <div id="error" class="alert alert--error" hidden></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="reg-username">Логин</label>
          <input id="reg-username" name="username" autocomplete="username"
                 placeholder="Только латиница, цифры, _ и ." autofocus>
          <span class="hint">3–32 символа: латиница, цифры, «_» и «.»</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="field">
          <label for="reg-password">Пароль</label>
          <input id="reg-password" name="password" type="password" autocomplete="new-password">
          <span class="hint">Минимум 8 символов</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="field">
          <label for="reg-name">Имя</label>
          <input id="reg-name" name="name" autocomplete="name" placeholder="Как к вам обращаться">
          <span class="hint">Минимум 2 символа</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="field">
          <label for="reg-phone">Телефон</label>
          <input id="reg-phone" name="phone" autocomplete="tel" placeholder="+7 900 000-00-00" inputmode="tel">
          <span class="hint">10–15 цифр, допускается ведущий «+»</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--md btn--block">Зарегистрироваться</button>
        </div>
      </form>

      <p class="form-alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script>
    (function () {
      var form = document.getElementById('register-form');
      var fields = {
        username: document.getElementById('reg-username'),
        password: document.getElementById('reg-password'),
        name: document.getElementById('reg-name'),
        phone: document.getElementById('reg-phone')
      };
      var submit = form.querySelector('button[type="submit"]');

      window.api.me().then(function (user) {
        if (user) window.ui.afterAuth();
      });

      function fieldError(key, msg) {
        var input = fields[key];
        var box = input.closest('.field');
        var el = box.querySelector('.field__error');
        if (msg) {
          box.classList.add('field--invalid');
          el.textContent = msg;
          el.hidden = false;
        } else {
          box.classList.remove('field--invalid');
          el.textContent = '';
          el.hidden = true;
        }
      }
      function clearFieldErrors(keys) {
        keys = keys || Object.keys(fields);
        keys.forEach(function (k) { fieldError(k, ''); });
      }
      Object.keys(fields).forEach(function (k) {
        fields[k].addEventListener('input', function () { fieldError(k, ''); });
      });

      // Зеркало серверных правил (validate.js) — подсказка до отправки.
      // Решение — на сервере, его ответ показываем ниже после отправки.
      var USERNAME_RE = /^[a-zA-Z0-9_.]{3,32}$/;
      var PHONE_RE = /^\+?[0-9]{10,15}$/;

      // Какому полю принадлежит ошибка сервера (по коду или по тексту).
      function fieldByServerError(err) {
        if (err.code === 'USERNAME_TAKEN') return 'username';
        if (err.code === 'PHONE_TAKEN') return 'phone';
        var m = ' ' + String(err.message || '') + ' ';
        if (/username|Логин/.test(m)) return 'username';
        if (/password|Пароль/.test(m)) return 'password';
        if (/Поле «name»|имя/i.test(m)) return 'name';
        if (/phone|Телефон/.test(m)) return 'phone';
        return null;
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        clearFieldErrors();

        var body = {
          username: fields.username.value.trim(),
          password: fields.password.value,
          name: fields.name.value.trim(),
          phone: fields.phone.value.trim()
        };

        var ok = true;
        if (!USERNAME_RE.test(body.username)) {
          fieldError('username', 'Логин: только латиница, цифры, «_» и «.» (3–32 симв.).');
          ok = false;
        }
        if (body.password.length < 8) {
          fieldError('password', 'Пароль должен быть не короче 8 символов.');
          ok = false;
        }
        if (body.name.length < 2) {
          fieldError('name', 'Имя должно содержать не меньше 2 символов.');
          ok = false;
        }
        if (!PHONE_RE.test(body.phone)) {
          fieldError('phone', 'Телефон: 10–15 цифр, допускается ведущий «+».');
          ok = false;
        }
        if (!ok) return;

        submit.disabled = true;
        window.api.request('/api/auth/register', { method: 'POST', json: body })
          .then(function () {
            window.ui.afterAuth();
          })
          .catch(function (err) {
            submit.disabled = false;
            // Текст ошибки уже показал api.request в #error; поле — по ответу.
            var key = fieldByServerError(err);
            if (key) fieldError(key, err.message);
          });
      });
    })();
  </script>
</body>
</html>
