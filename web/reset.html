<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый пароль — Ноготочки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <div id="global-header"></div>

  <main class="auth-wall">
    <h1>Новый пароль</h1>
    <div class="panel">
      <div id="error" class="alert alert--error" hidden></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="reset-password">Новый пароль</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" autofocus>
          <span class="hint">Минимум 8 символов</span>
          <span class="field__error" hidden></span>
        </div>
        <div class="field">
          <label for="reset-password2">Повторите пароль</label>
          <input id="reset-password2" name="password2" type="password" autocomplete="new-password">
          <span class="field__error" hidden></span>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--md btn--block">Сохранить пароль</button>
        </div>
      </form>

      <p class="form-alt"><a href="login.html">Вернуться ко входу</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/header.js"></script>
  <script>
    (function () {
      var form = document.getElementById('reset-form');
      var p1 = document.getElementById('reset-password');
      var p2 = document.getElementById('reset-password2');
      var submit = form.querySelector('button[type="submit"]');

      function fieldError(input, msg) {
        var box = input.closest('.field');
        var el = box.querySelector('.field__error');
        if (msg) {
          box.classList.add('field--invalid');
          el.textContent = msg;
          el.hidden = false;
        } else {
          box.classList.remove('field--invalid');
          el.textContent = '';
          el.hidden = true;
        }
      }
      [p1, p2].forEach(function (input) {
        input.addEventListener('input', function () { fieldError(input, ''); });
      });

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        fieldError(p1, '');
        fieldError(p2, '');

        var password = p1.value;
        var ok = true;
        if (password.length < 8) {
          fieldError(p1, 'Пароль должен быть не короче 8 символов.');
          ok = false;
        }
        if (password !== p2.value) {
          fieldError(p2, 'Пароли не совпадают.');
          ok = false;
        }
        if (!ok) return;

        submit.disabled = true;
        // Эндпоинт сброса в API не реализован: сервер вернёт 404,
        // и его ответ показываем текстом, как и любую другую ошибку.
        window.api.request('/api/auth/password/reset', {
          method: 'POST',
          json: { password: password, password2: p2.value }
        }).catch(function () { submit.disabled = false; });
      });
    })();
  </script>
</body>
</html>
