# Запуск сервиса «Ноготочки» через docker compose.
#
# Файл описывает всё, без чего сервис не поднимется, поэтому в панели
# развёртывания ничего заполнять руками не нужно: репозиторий + этот файл.
#
# Сборка идёт из корня репозитория и использует уже существующий Dockerfile
# (context: .). Менять Dockerfile не требуется — настройки приложения,
# которые от него зависят, уже прописаны там и здесь только подтверждены.

services:
  app:
    build:
      # Корень репозитория, а не backend/: Dockerfile копирует и backend/, и web/,
      # потому что сервер отдаёт фронтенд из каталога уровнем выше.
      context: .
      dockerfile: Dockerfile

    image: nogotki:latest

    # Перезапуск после падения и после перезагрузки сервера. without
    # "unless-stopped" контейнер остался бы лежать, если однажды упал.
    restart: unless-stopped

    ports:
      # Внутри контейнера приложение всегда слушает 3000 (PORT ниже).
      # Наружу отдаём тот же порт; за HTTPS и доменом должен стоять прокси.
      - "3000:3000"

    # ГЛАВНАЯ ЧАСТЬ ФАЙЛА. Папка с базой лежит СНАРУЖИ контейнера, в томе.
    # Контейнер при обновлении удаляется и создаётся заново — том остаётся.
    # Если убрать эти две строки, записи клиентов исчезнут на втором деплое:
    # молча, без ошибки в логах, потому что внутри контейнера база будет
    # создаваться пустой каждый раз.
    volumes:
      - nogotki-data:/data

    environment:
      # Путь к базе ВНУТРИ контейнера. В production обязателен: без него
      # приложение отказывается стартовать (src/config.js). Указывает в ту
      # самую папку /data, которую выше подключает том.
      - DB_PATH=/data/nogotki.db

      # Порт приложения. Совпадает с проброшенным выше.
      - PORT=3000

      # Боевой режим: включает обязательные проверки настроек и запрет
      # тестового сида. Без него приложение считает себя отладочным.
      - NODE_ENV=production

      # За прокси (Coolify, nginx) реальный адрес клиента приходит в
      # заголовке X-Forwarded-For. Без этого ограничение частоты блокировок
      # по IP будет считать всех клиентов одним адресом.
      - TRUST_PROXY=1

      # Временная подмена входа через Яндекс — ВЫКЛЮЧЕНА. Включена она только
      # при YANDEX_STUB=1 (src/config.js), поэтому строку с ней держим
      # закомментированной: она пускает в аккаунт под любой почтой без
      # проверки у Яндекса. Раскомментировать можно только для локальной
      # проверки и никогда — на сервере, открытом в интернете.
      # - YANDEX_STUB=1
      # - YANDEX_STUB_EMAIL=anna@example.ru
      # - YANDEX_STUB_NAME=Тестовый Пользователь

    # Секретов в файле нет намеренно. Токены входа подписывать нечем: каждая
    # выданная сессия — случайные 32 байта, а в базе хранится только их
    # SHA-256 (src/middleware/auth.js). Пароли учётных записей лежат в самой
    # базе в виде scrypt-хеша и задаются при первом наполнении, а не здесь.

volumes:
  # Именованный том Docker. Физически лежит на хосте
  # (/var/lib/docker/volumes/nogotki-data/_data) и не удаляется вместе с
  # контейнером — проверено удалением и пересозданием контейнера.
  #
  # "docker compose down" этот том НЕ удаляет. Удалить его может только
  # отдельная команда "docker compose down -v" — этого делать не нужно.
  nogotki-data:
    # name: ОБЯЗАТЕЛЬНО. Без него compose приписывает к имени тома имя
    # проекта (папки), и получается nogotki_nogotki-data — ДРУГОЙ, пустой
    # том. Приложение поднимается с чистой базой, данные в старом томе
    # остаются, но сервис их не видит: сайт открывается, а записи клиентов
    # «пропадают». Проверено вживую. С name имя тома фиксировано и не
    # зависит от того, как называется папка с проектом.
    name: nogotki-data
