<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Запись — тестовый фронтенд</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Вход/регистрация</a>
      <a href="services.html">Услуги и мастера</a>
      <a href="slots.html">Свободное время</a>
      <a href="booking.html">Записаться</a>
      <a href="cabinet.html">Мои записи</a>
      <a href="admin.html">Админ</a>
    </nav>
    <span id="who"></span>
    <button id="logout" hidden>Выйти</button>
  </header>
  <main>
    <h1>Создание записи</h1>
    <div id="error" hidden></div>
    <div id="ok" hidden></div>

    <div id="nopending" class="card" hidden>
      <p>Сначала выберите время на странице <a href="slots.html">«Свободное время»</a>.</p>
    </div>

    <div id="form-card" class="card" hidden>
      <h2>Детали записи</h2>
      <div id="summary"></div>
      <form id="booking-form">
        <label for="comment">Комментарий (необязательно)</label>
        <textarea id="comment" maxlength="500" placeholder="Пожелания мастеру, вопрос и т.п."></textarea>
        <button type="submit" class="primary">Записаться</button>
      </form>
    </div>

    <div id="result-card" class="card" hidden>
      <h2>Запись создана</h2>
      <div id="result"></div>
      <p><a href="cabinet.html">Перейти к моим записям</a> · <a href="slots.html">Записаться ещё</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      if (!window.requireAuth()) return;
      var logoutBtn = document.getElementById('logout');
      var who = document.getElementById('who');
      var u = window.api.user();
      if (u) { who.textContent = ' · ' + u.username + ' [' + (u.roles || []).join(', ') + ']'; logoutBtn.hidden = false; }
      logoutBtn.addEventListener('click', function () { window.api.logout(); });

      var pending;
      try { pending = JSON.parse(sessionStorage.getItem('pending_booking') || 'null'); } catch (e) { pending = null; }

      if (!pending) {
        document.getElementById('nopending').hidden = false;
        document.getElementById('form-card').hidden = true;
        return;
      }

      var box = document.getElementById('summary');
      box.innerHTML =
        '<table><tr><th>Мастер</th><td>' + api.esc(pending.master_name) + '</td></tr>' +
        '<tr><th>Услуга</th><td>' + api.esc(pending.service_name) + ' — ' + api.rub(pending.price_kopecks) + '</td></tr>' +
        '<tr><th>Время</th><td>' + api.fmt(pending.starts_at) + ' – ' + api.hour(pending.ends_at) + '</td></tr></table>';
      document.getElementById('form-card').hidden = false;

      document.getElementById('booking-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        var submitBtn = ev.target.querySelector('button');
        submitBtn.disabled = true;
        // Шаг 1 — удерживаем слот на 10 минут (POST /holds), шаг 2 — создаём запись по токену.
        api.request('/api/holds', {
          method: 'POST',
          json: {
            master_id: pending.master_id,
            service_ids: [pending.service_id],
            starts_at: pending.starts_at
          }
        }).then(function (hold) {
          return api.request('/api/bookings', {
            method: 'POST',
            json: {
              service_id: pending.service_id,
              master_id: pending.master_id,
              hold_token: hold.token,
              comment: document.getElementById('comment').value.trim() || null
            }
          });
        }).then(function (r) {
          sessionStorage.removeItem('pending_booking');
          document.getElementById('form-card').hidden = true;
          document.getElementById('result-card').hidden = false;
          renderResult(r.booking);
        }).catch(function () { submitBtn.disabled = false; });
      });

      function renderResult(b) {
        var box = document.getElementById('result');
        box.innerHTML =
          '<table><tr><th>Номер</th><td>#' + b.id + '</td></tr>' +
          '<tr><th>Статус</th><td><span class="badge ' + b.status + '">' +
          (window.BOOKING_STATUS[b.status] || b.status) + '</span></td></tr>' +
          '<tr><th>Мастер</th><td>' + api.esc(b.master.name) + '</td></tr>' +
          '<tr><th>Услуга</th><td>' + api.esc(b.service.name) + '</td></tr>' +
          '<tr><th>Цена</th><td>' + api.rub(b.service.price_kopecks) + '</td></tr>' +
          '<tr><th>Время</th><td>' + api.fmt(b.starts_at) + ' – ' + api.hour(b.ends_at) + '</td></tr>' +
          (b.comment ? '<tr><th>Комментарий</th><td>' + api.esc(b.comment) + '</td></tr>' : '') +
          '</table>';
      }
    })();
  </script>
</body>
</html>
