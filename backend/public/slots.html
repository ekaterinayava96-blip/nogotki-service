<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Свободное время — тестовый фронтенд</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Вход/регистрация</a>
      <a href="services.html">Услуги и мастера</a>
      <a href="slots.html">Свободное время</a>
      <a href="booking.html">Записаться</a>
      <a href="cabinet.html">Мои записи</a>
      <a href="admin.html">Админ</a>
    </nav>
    <span id="who"></span>
    <button id="logout" hidden>Выйти</button>
  </header>
  <main>
    <h1>Свободное время мастера</h1>
    <div id="error" hidden></div>
    <div id="ok" hidden></div>

    <div class="card">
      <h2>Параметры</h2>
      <form id="slot-form">
        <label for="master">Мастер</label>
        <select id="master" required></select>

        <label>Услуга (одна — запись создаётся на одну услугу)</label>
        <div id="services"></div>

        <label for="date">Дата (салон UTC+3)</label>
        <input id="date" type="date" required>

        <button type="submit" class="primary">Показать свободное время</button>
      </form>
    </div>

    <div class="card" id="slots-card" hidden>
      <h2 id="slots-title"></h2>
      <div id="slots" class="slots"></div>
      <p id="slots-empty" class="muted" hidden></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var logoutBtn = document.getElementById('logout');
      var who = document.getElementById('who');
      var u = window.api.user();
      if (u) { who.textContent = ' · ' + u.username + ' [' + (u.roles || []).join(', ') + ']'; logoutBtn.hidden = false; }
      logoutBtn.addEventListener('click', function () { window.api.logout(); });

      var params = new URLSearchParams(location.search);
      var masters = [];
      var services = [];

      var masterSel = document.getElementById('master');
      var serviceBox = document.getElementById('services');
      var dateInput = document.getElementById('date');
      dateInput.value = api.todaySalon();

      api.request('/api/masters').then(function (r) {
        masters = r.masters;
        masters.forEach(function (m) {
          var opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.name + ' · ' + (m.role || '');
          if (String(m.id) === params.get('master_id')) opt.selected = true;
          masterSel.appendChild(opt);
        });
        renderServices();
      }).catch(function () {});

      masterSel.addEventListener('change', renderServices);

      function renderServices() {
        var mid = Number(masterSel.value);
        var m = masters.find(function (x) { return x.id === mid; });
        if (!m) { serviceBox.innerHTML = ''; return; }
        var checkedFirst = !params.get('service_id');
        var html = '';
        m.services.forEach(function (s, i) {
          var checked = params.get('service_id')
            ? String(s.id) === params.get('service_id')
            : (checkedFirst && i === 0);
          html += '<label class="inline"><input type="radio" name="service_id" value="' + s.id + '"' +
            (checked ? ' checked' : '') + '> ' + api.esc(s.name) +
            ' — ' + api.rub(s.price_kopecks) + ' · ' + s.duration_minutes + ' мин</label>';
        });
        serviceBox.innerHTML = html;
        services = m.services;
      }

      function selectedService() {
        var rid = document.querySelector('input[name=service_id]:checked');
        if (!rid) return null;
        return services.find(function (s) { return Number(s.id) === Number(rid.value); });
      }

      document.getElementById('slot-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        window.ui.clear();
        var mid = Number(masterSel.value);
        var svc = selectedService();
        if (!svc) { window.ui.error('Выберите услугу.'); return; }
        if (!mid) { window.ui.error('Выберите мастера.'); return; }
        if (!dateInput.value) { window.ui.error('Укажите дату.'); return; }

        var url = '/api/masters/' + mid + '/slots?date=' + encodeURIComponent(dateInput.value) +
          '&service_ids=' + svc.id;
        api.request(url).then(function (r) {
          document.getElementById('slots-card').hidden = false;
          var m = masters.find(function (x) { return x.id === mid; });
          document.getElementById('slots-title').textContent =
            'Свободное время: ' + api.esc(svc.name) + ' · ' + api.esc(m ? m.name : '#') + ' · ' + r.date;
          var box = document.getElementById('slots');
          box.innerHTML = '';
          var empty = document.getElementById('slots-empty');
          if (!r.slots.length) {
            empty.hidden = false;
            empty.textContent = 'На эту дату свободного времени нет (все слоты заняты или мастер отдыхает).';
            return;
          }
          empty.hidden = true;
          r.slots.forEach(function (s) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = api.hour(s.starts_at) + ' – ' + api.hour(s.ends_at);
            btn.addEventListener('click', function () {
              window.ui.clear();
              sessionStorage.setItem('pending_booking', JSON.stringify({
                master_id: mid,
                service_id: svc.id,
                master_name: m ? m.name : '',
                service_name: svc.name,
                price_kopecks: svc.price_kopecks,
                starts_at: s.starts_at,
                ends_at: s.ends_at
              }));
              location.href = 'booking.html';
            });
            box.appendChild(btn);
          });
        }).catch(function () {});
      });
    })();
  </script>
</body>
</html>
