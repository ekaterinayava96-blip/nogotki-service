<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Услуги и мастера — тестовый фронтенд</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Вход/регистрация</a>
      <a href="services.html">Услуги и мастера</a>
      <a href="slots.html">Свободное время</a>
      <a href="booking.html">Записаться</a>
      <a href="cabinet.html">Мои записи</a>
      <a href="admin.html">Админ</a>
    </nav>
    <span id="who"></span>
    <button id="logout" hidden>Выйти</button>
  </header>
  <main>
    <h1>Услуги и мастера</h1>
    <div id="error" hidden></div>
    <div id="ok" hidden></div>

    <div class="card">
      <h2>Услуги и цены</h2>
      <div id="services"></div>
    </div>

    <div class="card">
      <h2>Мастера</h2>
      <div id="masters"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      var logoutBtn = document.getElementById('logout');
      var who = document.getElementById('who');
      var u = window.api.user();
      if (u) { who.textContent = ' · ' + u.username + ' [' + (u.roles || []).join(', ') + ']'; logoutBtn.hidden = false; }
      logoutBtn.addEventListener('click', function () { window.api.logout(); });

      function renderServices(services) {
        var box = document.getElementById('services');
        if (!services.length) { box.innerHTML = '<p class="muted">Услуг пока нет.</p>'; return; }
        var html = '<table><tr><th>Название</th><th>Цена</th><th>Длительность</th><th></th></tr>';
        services.forEach(function (s) {
          html += '<tr><td>' + api.esc(s.name) + '<div class="muted">' + api.esc(s.description || '') + '</div></td>' +
            '<td>' + api.rub(s.price_kopecks) + '</td>' +
            '<td>' + s.duration_minutes + ' мин</td>' +
            '<td><a href="slots.html?service_id=' + s.id + '">Выбрать время</a></td></tr>';
        });
        html += '</table>';
        box.innerHTML = html;
      }

      function renderMasters(masters) {
        var box = document.getElementById('masters');
        if (!masters.length) { box.innerHTML = '<p class="muted">Мастеров пока нет.</p>'; return; }
        var html = '';
        masters.forEach(function (m) {
          html += '<fieldset><legend>' + api.esc(m.name) + ' · ' + api.esc(m.role || '') + '</legend>' +
            '<p class="muted">Опыт: ' + api.esc(String(m.experience_years || 0)) + ' лет · записей: ' + m.bookings_count + '</p>' +
            '<ul>' + m.services.map(function (s) {
              return '<li>' + api.esc(s.name) + ' — ' + api.rub(s.price_kopecks) +
                ' (' + s.duration_minutes + ' мин) <a href="slots.html?master_id=' + m.id + '&service_id=' + s.id + '">записаться</a></li>';
            }).join('') + '</ul></fieldset>';
        });
        box.innerHTML = html;
      }

      Promise.all([
        api.request('/api/services'),
        api.request('/api/masters')
      ]).then(function (results) {
        renderServices(results[0].services);
        renderMasters(results[1].masters);
      }).catch(function () {});
    })();
  </script>
</body>
</html>
